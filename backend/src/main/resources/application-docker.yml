server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://database:3306/counter_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: counter_user
    password: counter_password
    driver-class-name: com.mysql.cj.jdbc.Driver
  
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
  
  # CORS 설정
  web:
    cors:
      allowed-origins: "*"
      allowed-methods: "*"
      allowed-headers: "*"
