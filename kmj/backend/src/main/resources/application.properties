spring.application.name=backend

server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/counterdb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul
spring.datasource.username=app
spring.datasource.password=qwer1234
